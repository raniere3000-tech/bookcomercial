<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Águas do Rio — Central de Links</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image: url('aguas-do-rio.jpeg');
    background-size: cover;
    background-position: left top;
    background-repeat: no-repeat;
    background-color: #102840;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(23,79,112,0.35), rgba(16,40,64,0.80));
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 440px;
    width: 90%;
    padding: 44px 40px;
    border-radius: 28px;
    background: rgba(16,40,64,0.62);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.45);
    text-align: center;
    animation: aparecer 0.8s ease-out;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-texto {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    color: #9fe1e7;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 1.6rem;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  p {
    color: rgba(255,255,255,0.9);
    margin-bottom: 32px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 22px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    background: linear-gradient(120deg, #176b9c, #16a5b8);
    border: 1px solid rgba(255,255,255,0.18);
    transition: all 0.25s ease;
  }

  .links a:hover {
    transform: translateY(-3px);
    background: linear-gradient(120deg, #16a5b8, #1f8a70);
    box-shadow: 0 12px 28px rgba(22,165,184,0.45);
  }

  .rodape {
    margin-top: 28px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.65);
  }

  @media(max-width: 480px) {
    .card { padding: 36px 26px; }
    h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="logo-texto">💧 ÁGUAS DO RIO • BOOK EXECUTIVO</div>
  <h1>Central de Links</h1>
  <p>Acesse o relatório abaixo</p>
  <nav class="links">
    <a href="DRE_Final.html">📊 DRE Faturamento</a>
    <a href="DRE_Comercial.html">📈 DRE Comercial e Receita</a>
  </nav>
  <div class="rodape">&copy; 2026 Águas do Rio. Todos os direitos reservados.</div>
</main>

</body>
</html>
